sudo: false
language: java
dist: trusty

branches:
  except:
    - /^tmp\/.*/
    - /^REL.*/

before_script:
  # The Travis image no longer provisions old PostgreSQL servers via addons, so start the
  # server the same way the project's GitHub CI does: docker/postgres-server (which also
  # creates the test user, the test database and the hstore/sslinfo extensions)
  - docker compose version
  # the image runs its own PostgreSQL on 5432; free the port for the container
  - sudo systemctl stop postgresql
  # replicas on 5433/5434 serve the multi-host tests; the server is started with SSL, so enable the SSL tests
  - cd docker/postgres-server && PGV=$PG_VERSION CREATE_REPLICAS=yes docker compose up -d && cd ../..
  - echo "enable_ssl_tests=true" > ssltest.local.properties
  - for i in $(seq 1 90); do pg_isready -h localhost -p 5432 -U postgres && break; sleep 2; done
  - pg_isready -h localhost -p 5432 -U postgres
  - (cd docker/postgres-server && docker compose logs)

env:
  global:
    - secure: "NI+aqwRLLVt2feJdk/2ZEZnsaPyu+vOx8MahVxjz0UUVvRHVqxM5O1M0R53NJfEeIjflOzgZJwRLqgyl6dkdfjytRhaHWGptQdehV4cwNb+4epnn8WlpRzMac65zTQqnbGVtw9jissDQv6/Zl/+D+DMcU65BbFZkix40whILXG0="

before_install:
  - unset _JAVA_OPTIONS # see https://github.com/travis-ci/travis-ci/issues/8408

script:
  # make sure previous build artifacts are not used for subsequent builds
  - rm -rf $HOME/.m2/repository/org/postgresql
  - ./.travis/travis_build.sh
  - ./.travis/travis_check_postgres_health.sh
  # name every skipped test and the reason it was skipped
  - SEAL_LEG="Travis PG $PG_VERSION, SSL and replicas enabled; Replication-tagged tests excluded by -PskipReplicationTests and SlowTests by includeTestTags (both upstream travis_build.sh defaults)" python3 .github/seal-skip-report.py pgjdbc
  # To avoid useless S3 cache updates (https://github.com/travis-ci/travis-ci/issues/1441#issuecomment-67607074)
  #- mkdir /tmp/cache-trick
  #- mv $HOME/.m2/repository/org/postgresql /tmp/cache-trick/

before_cache:
  - F=CleanupGradleCache sh -x -c 'curl -O https://raw.githubusercontent.com/vlsi/cleanup-gradle-cache/v1.x/$F.java && javac -J-Xmx128m $F.java && java -Xmx128m $F'
  - find $HOME/.ivy2 -name "ivydata-*.properties" -print0 | xargs -0 rm -v
  - rm -rf $HOME/.ivy2/cache/org.postgresql/
  - find $HOME/.sbt -name "*.lock" -print0 | xargs -0 rm -v
  # No sense in caching current build artifacts
  - rm -rf $HOME/.m2/repository/org/postgresql

# Skip default "mvn install" issued by Travis
# Root project cannot be compiled with older JDKs, so it makes sense to just skip the step
install: true

cache:
  directories:
    - $HOME/.gradle/caches/
    - $HOME/.gradle/wrapper/
    - $HOME/.m2/repository
    - $HOME/.ivy2/cache
    - $HOME/.sbt/boot/

matrix:
  fast_finish: true
  include:
    - env:
        - PG_VERSION=14
        - MVN_CUSTOM_ARGS=-PskipForbiddenApis
